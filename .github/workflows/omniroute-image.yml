# OmniRoute image for the 8sync VPS, built for the URL subpath /router-ai.
# Next.js basePath is fixed at build time; the upstream images are built for the domain root and
# their start-up patch leaves client-side links at the root (scripts/vps/omniroute/compose.yml).
# Daily: when upstream has a release this package lacks, build it with OMNIROUTE_BASE_PATH and push
# ghcr.io/<owner>/omniroute-router-ai:<tag> and :latest. The VPS pulls :latest every night
# (omniroute-update.timer) and rolls back if the new image is not healthy.
name: omniroute-image
on:
  schedule:
    - cron: "0 18 * * *" # 01:00 Vietnam time, three hours before the VPS update
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the release tag is already published
        type: boolean
        default: false
  push:
    paths: [.github/workflows/omniroute-image.yml]
permissions:
  contents: read
  packages: write
concurrency:
  group: omniroute-image
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Latest upstream release
        id: up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          tag=$(gh api repos/diegosouzapw/OmniRoute/releases/latest -q .tag_name)
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/omniroute-router-ai"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "img=$img" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" != true ] && docker manifest inspect "$img:$tag" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$img:$tag already published"
          fi
      - uses: actions/checkout@v4
        if: steps.up.outputs.skip != 'true'
        with:
          repository: diegosouzapw/OmniRoute
          ref: ${{ steps.up.outputs.tag }}
          path: src
      - uses: docker/setup-buildx-action@v3
        if: steps.up.outputs.skip != 'true'
      # Upstream's own publish settings (docker-publish.yml): webpack, 12 GB V8 heap for `next build`.
      - uses: docker/build-push-action@v6
        if: steps.up.outputs.skip != 'true'
        with:
          context: src
          target: runner-base
          platforms: linux/amd64
          push: true
          build-args: |
            OMNIROUTE_BASE_PATH=/router-ai
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=12288
          tags: |
            ${{ steps.up.outputs.img }}:${{ steps.up.outputs.tag }}
            ${{ steps.up.outputs.img }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=OmniRoute ${{ steps.up.outputs.tag }} built for the /router-ai subpath
            org.opencontainers.image.licenses=MIT
