name: Deploy su-code Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Publish the installers at a short, stable URL:
      #   curl -fsSL https://get.8syncdev.com/install | sh
      # Copied from the repo root at deploy time rather than committed twice, so
      # `install.sh` stays the single source of truth and the published copy can
      # never drift from it. A file (not an HTML redirect) is required: `curl`
      # does not follow meta-refresh, and GitHub Pages cannot emit an HTTP 3xx.
      - name: Stage installers for the short URL
        run: |
          install -m 0644 install.sh  docs/install
          install -m 0644 install.ps1 docs/install.ps1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
