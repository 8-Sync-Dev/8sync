# Tests on every push / PR on the three desktop OSes, plus the
# `--no-default-features` build that no release job covers, and the release size gate
# (linux-x86_64 musl) so an oversized binary fails here instead of at the tag. Free on public repos.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --locked
      # The release helpers (CHANGELOG merge, version bump) with Vietnamese text: UTF-8 in, LF out.
      - name: Release helper scripts
        shell: bash
        run: bash su-code/handoff/scripts/test-scripts.sh
      # Token tooling (token-usage.py, scope-ecc-rules.py): stdlib only, no install.
      - name: Python script tests
        shell: bash
        run: '"$(command -v python3 || command -v python)" -I -m unittest discover -s scripts -p "test_*.py"'
      # `ccc . ls` order, urgency chip and JSON against the real binary in a sandbox registry. Linux
      # only: the sandbox needs XDG_CONFIG_HOME, which dirs::config_dir() ignores on Windows/macOS.
      - name: UAT ls order + urgency
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: cargo build --locked -p su-code --bin 8sync && bash scripts/uat/ls-urgency.sh target/debug/8sync

  minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --no-default-features
        run: cargo build --locked --no-default-features

  # The omp extensions/hooks are typechecked only in release.yml; v0.101.0's first tag failed
  # there (`Promise.withResolvers` outside the es2023 lib). Same command, before the tag.
  ts-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck shipped TypeScript assets
        run: |
          npm install --no-audit --no-fund --silent
          npx tsc --noEmit -p tsconfig.extensions.json

  # The release size gate, before the tag: v0.67.0, v0.74.0, v0.78.0, v0.81.0, v0.89.0, v0.93.0
  # and v0.98.0 were tagged and then failed it, because nothing measured the asset earlier. Same toolchain and command
  # as release.yml's linux-x86_64 leg (the largest asset), so the number matches the release.
  size-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-musl
      - name: Build (release, linux-x86_64 musl)
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Size gate
        run: bash scripts/size-gate.sh target/x86_64-unknown-linux-musl/release/8sync
      - name: Size gate fails over the ceiling (self-test)
        run: |
          if CEILING=1 bash scripts/size-gate.sh target/x86_64-unknown-linux-musl/release/8sync > /dev/null 2>&1; then
            echo "::error::size-gate.sh passed a binary over CEILING=1"
            exit 1
          fi
          echo "self-test ok: the gate fails over the ceiling"

  # hq-ui typecheck + unit tests (builds stay on CI: the owner's machine is for coding).
  hq-ui-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/hq-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - run: pnpm install --frozen-lockfile
      # RouteContext / LayoutProps are generated by Next; no build needed
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run

  # Exercise the hq-ui release packaging on PRs (the real one only runs on a tag).
  package-hq-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - name: package hq-ui
        run: bash scripts/package-hq-ui.sh 0.0.0-ci
      - name: tarball has no symlinks or native files
        run: |
          set -euo pipefail
          t=dist/8sync-hq-ui-v0.0.0-ci.tar.gz
          bad=$(tar -tvzf "$t" | grep -E '^l' || true)
          [ -z "$bad" ] || { echo "symlinks in tarball:" >&2; echo "$bad" >&2; exit 1; }
          native=$(tar -tzf "$t" | grep -E '\.(node|so|dylib|dll|exe)$|\.so\.' || true)
          [ -z "$native" ] || { echo "native files in tarball:" >&2; echo "$native" >&2; exit 1; }
      - name: tarball boots (server.js + static assets)
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          tar -xzf dist/8sync-hq-ui-v0.0.0-ci.tar.gz -C "$d"
          HOME="$d" HOSTNAME=127.0.0.1 PORT=8799 node "$d/hq-ui/server.js" > "$d/ui.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8799/ && break; sleep 1; done
          code=$(curl -s -o "$d/index.html" -w '%{http_code}' http://127.0.0.1:8799/)
          [ "$code" = 200 ] || { echo "/ -> $code" >&2; cat "$d/ui.log" >&2; exit 1; }
          asset=$(grep -oE '/_next/static/[^"]+\.(css|js)' "$d/index.html" | head -1)
          [ -n "$asset" ] || { echo "no /_next/static asset in the page" >&2; exit 1; }
          acode=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8799$asset")
          [ "$acode" = 200 ] || { echo "$asset -> $acode" >&2; exit 1; }
          echo "ok: / and $asset -> 200"
      # UAT on the owner's machine runs this exact tarball instead of building locally.
      - uses: actions/upload-artifact@v4
        with:
          name: hq-ui-tarball
          path: dist/8sync-hq-ui-v0.0.0-ci.tar.gz
          retention-days: 7
