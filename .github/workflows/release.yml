name: Release

# Build native 8sync binaries on real macOS / Windows / Linux runners and
# publish them to a GitHub Release when a vX.Y.Z tag is pushed.
#
# Asset names follow the scheme consumed by install.sh / install.ps1:
#   8sync-${tag}-${os}-${arch}[.exe]
# where ${tag} is the pushed tag (e.g. v0.46.2).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag for asset names on manual dispatch (e.g. v0.46.2)"
        required: false
        type: string

jobs:
  build:
    name: build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — musl static builds for glibc-independent portability.
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            label: linux-x86_64
            ext: ""
            zig: false
          # aarch64 cross-compiles with cargo-zigbuild (zig as linker) rather
          # than `cross`: `cross` runs the build inside a Docker image with no JS
          # toolchain, so build.rs could not build the Vite dashboard and silently
          # embedded the stub page into this asset. zigbuild runs on the runner,
          # where npm exists, so the asset gets the real dashboard — and the
          # Docker leg disappears. Locally: 31.9 s → static aarch64 ELF.
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            label: linux-aarch64
            ext: ""
            zig: true
          # macOS — both slices on Apple-Silicon runners (macos-13 Intel is
          # deprecated / scarce; macos-14 fails during scheduled brownouts and is
          # retired 2026-11-02, actions/runner-images#13518 — `macos-latest` is the
          # image CI already tests on). arm64 builds native; x86_64 cross-compiles via
          # the rustup target (Apple clang handles the C deps for both arches).
          # Deliberately NOT `universal2`: a fat binary would make every Mac user
          # download both slices, which is the opposite of this repo's size goal.
          - runner: macos-latest
            target: x86_64-apple-darwin
            label: darwin-x86_64
            ext: ""
            zig: false
          - runner: macos-latest
            target: aarch64-apple-darwin
            label: darwin-arm64
            ext: ""
            zig: false
          # Windows — native MSVC build.
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            ext: ".exe"
            zig: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The tag is the only thing that names a release; the binary reports
      # `env!("CARGO_PKG_VERSION")`. Let those disagree and every up-to-date user
      # is told "update available" on every check, forever, and `8sync up`
      # re-downloads the binary each run because the comparison never converges.
      - name: Gate — tag matches Cargo.toml version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          manifest=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${tag#v}" != "$manifest" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $manifest"
            exit 1
          fi
          echo "tag $tag == Cargo.toml $manifest"

      - name: Install musl toolchain
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # zig is the LINKER for the aarch64-musl leg. Version pinned to the one
      # this was verified against locally (zig 0.16.0 + cargo-zigbuild 0.23.0
      # produced a 4 151 328 B static aarch64 ELF in 31.9 s).
      - name: Install zig
        if: ${{ matrix.zig }}
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild
        if: ${{ matrix.zig }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build (native)
        if: ${{ !matrix.zig }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (zig cross)
        if: ${{ matrix.zig }}
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      # Correctness gate. Runs only on the native host build — the cross targets
      # cannot execute their own test binaries, and running it once is enough.
      - name: Test
        if: ${{ !matrix.zig }}
        run: cargo test --release --locked --target ${{ matrix.target }}

      # `assets/extensions/*.ts` and `assets/hooks/*.ts` are embedded verbatim and
      # run by omp under Bun, which STRIPS types without checking them. Without
      # this step a type error in a shipped extension is only discovered at
      # runtime, in the user's session.
      - name: Typecheck shipped TypeScript assets
        if: ${{ !matrix.zig && runner.os == 'Linux' }}
        shell: bash
        run: |
          npm install --no-audit --no-fund --silent
          npx tsc --noEmit -p tsconfig.extensions.json

      - name: Compute asset name
        shell: bash
        run: |
          version="${{ github.event.inputs.tag || github.ref_name }}"
          echo "ASSET=8sync-${version}-${{ matrix.label }}${{ matrix.ext }}" >> "$GITHUB_ENV"

      - name: Package binary (unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: cp "target/${{ matrix.target }}/release/8sync" "$ASSET"

      - name: Package binary (windows)
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: cp "target/${{ matrix.target }}/release/8sync.exe" "$ASSET"

      - name: Size gate
        shell: bash
        run: bash scripts/size-gate.sh "$ASSET"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  # The HQ web UI + MCP channel: one platform-independent tarball (Next standalone +
  # esbuild-bundled channel, no native binaries) that `8sync hq ui` downloads and
  # sha256-verifies on first run. Built once on Linux, not per target.
  hq-ui:
    name: package hq-ui
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Package hq-ui
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: bash scripts/package-hq-ui.sh "${TAG#v}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hq-ui
          path: dist/8sync-hq-ui-*
          if-no-files-found: error

  release:
    name: publish release
    needs: [build, hq-ui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # `<binary>.sha256` (sha256sum format) beside each binary: `8sync up` verifies
      # against it when the GitHub API gives no digest (rate limit, digest not ready).
      - name: Checksums for the binaries
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for f in 8sync-v*; do
            case "$f" in *.sha256) continue ;; esac
            sha256sum "$f" > "$f.sha256"
          done
          cat 8sync-v*.sha256

      # Release notes = this version's CHANGELOG section (+ install line); GitHub's
      # generated PR list is appended below it.
      - name: Release notes from CHANGELOG
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          v="${TAG#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          printf '\n---\nInstall or update: `curl -fsSL https://get.8syncdev.com/install | sh` · `8sync up` · then `8sync ccc kit`\n' >> notes.md
          head -5 notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          body_path: notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
