[package]
name = "su-code"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "8sync — vibe coding harness for CachyOS + Kitty + Helix"

[[bin]]
name = "8sync"
path = "src/main.rs"

# The dashboard is the one genuinely optional subsystem. `default` keeps the
# released binary complete — the gate exists so its weight is MEASURABLE
# (scripts/size-report.sh) and so a minimal build is possible on machines that
# only want the vibe loop.
# `marketplace` is deliberately NOT its own feature: `verbs/harness/marketplace.rs`
# has exactly one caller (`web.rs` → /api/marketplace), so `scraper` is
# dashboard-only and lives inside `web`.
# There is no `toolstats` feature: it used to gate `rusqlite` (measured
# 1 060 840 B), which was deleted once the A/B showed the DB stored nothing.
[features]
default = ["web"]
web = ["dep:axum", "dep:tokio", "dep:tower-http", "dep:scraper"]

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"] }
# `8sync completions <shell>`: tab-completion scripts generated from the same clap tree.
clap_complete = "4.5"
anyhow = "1.0"
ccc-core = { path = "../ccc-core" }
owo-colors = "4.1"
dirs = "5.0"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
which = "7.0"
# `8sync ccc secret set --generate`: OS randomness (already in the tree via other crates).
getrandom = "0.2"
indoc = "2.0"
# `compression` (include-flate) shrinks the embedded assets/skills + web/dist tree
# at compile time, decompressed transparently on `.data` — offsets bundled rusqlite
# + impeccable + the Vite FE to keep the binary lean.
rust-embed = { version = "8.5", features = ["debug-embed", "compression"] }
serde_json = "1.0"
urlencoding = "2.1"
# `8sync harness web` dashboard (axum + tokio) — intentional override of the
# "avoid tokio" rule in AGENTS.md §8; gated behind the `web` feature.
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "query"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros"], optional = true }
tower-http = { version = "0.5", features = ["cors"], optional = true }
# `8sync harness web` marketplace — Rust-first HTML scraping (pure Rust,
# html5ever + CSS selectors) for aggregator sites without a JSON API (mcp.so).
# HTTP still shells out to `curl` (no reqwest); scraper only parses the DOM.
scraper = { version = "0.20", optional = true }
