[package]
name = "ccc-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "8sync ccc core: session registry, transcript view, secret masker, JSON row types (stable surface ZUS links)"
publish = false

[lib]
name = "ccc_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
# Home dir like the CLI's `env.home` (profile folder on Windows): the stop-failure records.
dirs = "5.0"
