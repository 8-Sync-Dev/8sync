# 9router gateway (~/.omp/agent/models.yml) — deployed by `8sync harness gateway apply`.
#
# GPT/Codex = cx/ prefix (OpenAI API). No Claude provider here: Claude in omp goes only
# through a Console API key (`8sync harness claude-code`), never a third-party proxy.
# OPT-IN: routes a ChatGPT/Codex subscription through a third-party router (OpenAI terms
# not verified) — requires EIGHTSYNC_GATEWAY_ACCEPT=1.
#
# `__NINE_ROUTER_KEY__` is substituted at apply time from $NINE_ROUTER_KEY (or the
# previously-deployed key). Edit modelRoles routing via `8sync harness model`, NOT here.
providers:
  9router-cx:
    baseUrl: https://9router.cloudgo.vn/v1
    apiKey: __NINE_ROUTER_KEY__
    api: openai-completions
    models:
      - id: cx/gpt-5.5
        name: GPT-5.5 (9router)
        reasoning: true
        input: [text, image]
        contextWindow: 400000
        maxTokens: 128000
        cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}
      - id: cx/gpt-5.4
        name: GPT-5.4 (9router)
        reasoning: true
        input: [text, image]
        contextWindow: 400000
        maxTokens: 128000
        cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}
      - id: cx/gpt-5.4-mini
        name: GPT-5.4 mini (9router)
        reasoning: true
        input: [text, image]
        contextWindow: 400000
        maxTokens: 128000
        cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}
