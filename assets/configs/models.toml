# ~/.config/8sync/models.toml — adaptive model routing for omp.
#
# PHILOSOPHY (8 Sync Dev):
#   Opus = việc cần TƯ DUY (plan · review · debug · ảnh/vision · suy luận sâu).
#   GLM  = việc CƠ HỌC ít logic (code · edit · đọc file · xoá · default · trivial).
#
# 8sync classifies each `8sync ai "<prompt>"` into a task class and passes the
# matching model to omp via `--model`. omp resolves the name against its own
# catalog with fuzzy matching, so short names work: "glm", "opus", "haiku",
# "codex", or a full "provider/model-id". The [roles] models are passed as
# --plan / --smol / --slow so omp's OWN routing uses your picks too.
#
# Edit freely (or via `8sync harness model <key> <value>`). "" = let omp decide.
# Override one call:  8sync ai --model opus "review this PR"
#
# Vision/ảnh: GLM-5.3 / GLM-5.3-Flash are native VLMs — they read images in-session
# (https://docs.z.ai/guides/vlm/glm-5.3-flash). Do not bounce pixels to zai-vision MCP.
# omp has no --vision CLI flag; combo `claude+glm` now keeps vision on GLM when cheap
# is a native VLM. Override in ~/.omp/agent/config.yml → modelRoles.vision if needed.

# advisor = passive per-turn reviewer that checks each turn against the rules
# (code-intel first, correct tool names, open SKILL.md) and injects corrective
# notes. ON by default via `8sync ai` / `8sync .` (skipped for trivial prompts
# to stay token-optimal). Costs a small per-turn review; set false to disable
# globally, or `8sync ai --no-advisor` for one run.
advisor = true

# step0 = STEP-0 tool-routing enforcement (default ON). 8sync launches omp with a
# `--config` overlay setting `grep.enabled = false` + `glob.enabled = false`, so
# the two redundant searchers are gone from the session and code lookup MUST use
# trail (CLI) first. It names only what to REMOVE,
# so every other tool omp ships (MCP/xdev included) survives untouched.
# `bash rg`/`grep -r` shell escapes on source are also blocked by
# `bashInterceptor.patterns` — the rules are the `[bashInterceptor]` section at
# the bottom of this file, deployed by `8sync harness`. Set false to keep
# `grep`/`glob`, or override one run: `8sync ai --no-step0`.
step0 = true

[roles]
default = ""        # main working model ("" = let omp decide via ~/.omp/agent/config.yml)
plan    = "opus"    # architectural planning → Opus (deep thinking)
smol    = "glm"     # cheap/fast: titles + memory (mechanical) → GLM
slow    = "opus"    # deep reasoning / hard bugs → Opus
[tasks]
# Prompt class → model. Classes detected heuristically: plan | review | debug | code | trivial
plan    = "opus"    # planning            → thinking → Opus
review  = "opus"    # code review         → thinking → Opus
debug   = "opus"    # debugging           → thinking → Opus
code    = "glm"     # write/edit code     → mechanical → GLM
trivial = "glm"     # tiny mechanical ops → GLM

# ── bashInterceptor — the STEP-0 shell guard ─────────────────────────────────
# `8sync harness` renders these rules into `~/.omp/agent/config.yml` as omp's own
# `bashInterceptor.patterns`, which makes a matching `bash` command return a TOOL
# ERROR naming the replacement. This is the layer that closes the shell escape
# `step0` leaves open: the overlay removes the `grep`/`glob` TOOLS, not the shell.
# Shape is omp's, verbatim: { pattern (JS regex), tool, message }.
#
# `tool` is NOT the tool you want called — it is the gate omp checks. Its matcher
# SKIPS any rule whose `tool` is absent from the session, so naming an MCP tool
# that may not be registered silently disables the rule. `lsp` is always present
# and is an honest code-intel answer, so every rule points there and names the
# real replacement (trail) in `message`.
#
# Safe degradation (UC-7): 8sync writes this block only on a machine that really
# has `trail` on PATH, and REMOVES the block it wrote when it is gone — a
# trail-less box is never dead-ended. Opt out by
# hand with `enabled = false` or an empty `patterns` list; the next
# `8sync harness` then un-installs the block. Editing `message` is safe; the
# block is identified by a managed comment, not by its text.
#
# Each pattern matches at a COMMAND POSITION (start of string or after `;`/`&&`/
# `||`/`|`), tolerating `\` escapes, `NAME=value` prefixes and wrapper words
# (`sudo`/`time`/`env`/`xargs`/…), because `cd src && rg TODO` is exactly what an
# agent writes and a bare `^` anchor lets it through. Rule 2 walks `grep`'s option
# cluster instead of `.*` so a flag-looking string inside the SEARCH PATTERN
# (`grep " -r " f.txt`) is not mistaken for a flag: single-file and log `grep`
# stay allowed on purpose.
[bashInterceptor]
enabled = true

[[bashInterceptor.patterns]]
pattern = '(?:^|[;&|])\s*\\?(?:[A-Za-z_][A-Za-z0-9_]*=\S*\s+)*(?:(?:sudo|time|command|nohup|env|xargs|do|then|else)\s+)*(?:rg|ripgrep|ag|ack|fd|git\s+grep)\s+'
tool = "lsp"
message = 'STEP-0: search code with `trail ask "<question>"` / `trail grep "<pattern>"` — not rg/fd/ag/ack/git grep.'

[[bashInterceptor.patterns]]
pattern = '''(?:^|[;&|])\s*\\?(?:[A-Za-z_][A-Za-z0-9_]*=\S*\s+)*(?:(?:sudo|time|command|nohup|env|xargs|do|then|else)\s+)*(?:e|f)?grep\s+(?:(?:-(?!-\s)[^\s;&|]+|[^\s;&|'"-][^\s;&|]*)\s+)*(?:-[A-Za-z]*[rR][A-Za-z]*|--recursive|--dereference-recursive)\b'''
tool = "lsp"
message = 'STEP-0: recursive code search goes through `trail ask "<question>"` / `trail grep "<pattern>"`. Single-file and log `grep` stay allowed.'

[[bashInterceptor.patterns]]
pattern = '(?:^|[;&|])\s*\\?(?:[A-Za-z_][A-Za-z0-9_]*=\S*\s+)*(?:(?:sudo|time|command|nohup|env|xargs|do|then|else)\s+)*find\s+[^;&|]*(?<=\s)(?:-name|-iname|-type|-regex|-path|-wholename)\b'
tool = "lsp"
message = 'STEP-0: locate files and symbols with `trail ask "<name>"` / `trail skeleton <file>` instead of find.'
