# OmniRoute (github.com/diegosouzapw/OmniRoute) at https://vps.8syncdev.com/router-ai, no port in any URL.
# Image: upstream release built with basePath /router-ai (.github/workflows/omniroute-image.yml).
#   The upstream images are built for the domain root; their start-up OMNIROUTE_BASE_PATH patch
#   leaves client-side links and lazy chunks at the root (3.8.51), so the dashboard breaks.
# Dashboard: behind the edge GitHub gate (owner only) + OmniRoute's own login (router-ai.routes).
# API: https://vps.8syncdev.com/router-ai/v1, open to the internet, locked by OmniRoute API keys.
# Updates: omniroute-update.timer pulls this image daily, rollback on a failed health check.
# Secrets: .env next to this file (root, 600).
name: omniroute
services:
  omniroute:
    image: ghcr.io/8-sync-dev/omniroute-router-ai:latest
    container_name: omniroute
    restart: unless-stopped
    stop_grace_period: 40s
    env_file: .env
    environment:
      # Must equal the basePath baked into the image (no start-up patch then).
      OMNIROUTE_BASE_PATH: /router-ai
      NEXT_PUBLIC_BASE_URL: https://vps.8syncdev.com/router-ai
      REQUIRE_API_KEY: "true"
      AUTH_COOKIE_SECURE: "true"
      ALLOW_API_KEY_REVEAL: "false"
      # 2 vCPU / 3.8 GB box shared with the CI runner: dashboard + normal chat, not long coding-agent contexts.
      OMNIROUTE_MEMORY_MB: "1024"
    mem_limit: 2g
    volumes:
      - omniroute-data:/app/data
    # No host port: Caddy reaches omniroute:20128 on the edge network.
    networks: [edge]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
networks:
  edge:
    external: true
volumes:
  omniroute-data: {}
